            {

                corrects: [0, 2],
                explain: '"ปัญญาประดิษฐ์" และ "โทรทัศน์" เป็นคำที่ราชบัณฑิตยสภาบัญญัติขึ้นใหม่ด้วยคำไทย/บาลี-สันสกฤต ส่วนข้อ 2, 4, 5 เป็นคำทับศัพท์ภาษาอังกฤษ'

        multiQuestions.forEach(q => {
            const qId = 'm_' + q.qNum;
            const choicesHtml = q.choices.map((c, cIdx) => `
                <button class="choice-btn" id="${qId}_c${cIdx}" onclick="toggleMulti('${qId}', ${cIdx}, [${q.corrects.join(',')}])">

            slidesData.push({
                menuTitle: `ข้อ ${q.qNum} (5 ตัวเลือก 2 คำตอบ) : ${q.strand}`,
                title: `☑️ ข้อสอบข้อที่ ${q.qNum} (ปรนัย 5 ตัวเลือก 2 คำตอบ • 2.75 คะแนน)`,
                strand: q.strand,
                isQuiz: true,
                quizType: 'multi',
                quizId: qId,
                corrects: q.corrects,
                html: `
                    <div class="question-text">${q.qNum}. ${q.question}</div>
                    <p style="color:#6d28d9; font-size:0.95rem; margin-bottom:10px; font-weight:700;">💡 คลิกเลือกคำตอบ 2 ข้อเพื่อตรวจผล</p>
                    <div class="choices-grid">${choicesHtml}</div>
                    <div class="answer-panel" id="ans_${qId}">

                `
            });
        });

        // Question 29: หมวดสัมพันธ์กัน (1 ข้อ = 2.36 คะแนน)
        slidesData.push({
            menuTitle: 'ข้อ 29 (หมวดสัมพันธ์กัน) : ระดับภาษาและคำต่างประเทศ',
            title: '🔗 ข้อสอบข้อที่ 29 (รูปแบบหมวดสัมพันธ์กัน • 2.36 คะแนน)',
            strand: 'สาระที่ 4 หลักการใช้ภาษาไทย (ม.3/1, ม.3/3, ม.3/6)',
            isQuiz: true,
            quizType: 'revealOnly',
            quizId: 'match_29',
            html: `
                <div class="question-text">29. จงจับคู่ข้อความทางซ้ายกับหมวดหมู่ทางขวาให้สัมพันธ์กัน</div>
                <table class="match-table">
                    <thead>
                        <tr><th>รายการ (ส่วนที่ 1)</th><th>ตัวเลือกหมวดหมู่ (ส่วนที่ 2)</th></tr>
                    </thead>
                    <tbody>
                        <tr><td><strong>29.1</strong> “กระผมขอขอบพระคุณท่านผู้มีเกียรติทุกท่าน”</td><td>ก. ภาษาเขมร (คำแผลง/ตัวสะกด จ ญ ร ล ส)</td></tr>
                        <tr><td><strong>29.2</strong> คำว่า “เสด็จ, เจริญ, ถนน”</td><td>ข. ระดับภาษาทางการ / พิธีการ</td></tr>
                        <tr><td><strong>29.3</strong> โคลงสี่สุภาพ 1 บท บังคับวรรณยุกต์</td><td>ค. เอก 7 แห่ง โท 4 แห่ง</td></tr>
                    </tbody>
                </table>
                <div class="answer-panel" id="ans_match_29">
                    <strong>✅ เฉลยหมวดสัมพันธ์กัน:</strong><br>
                    • <strong>29.1 คู่กับ ข.</strong> (การใช้ "กระผม / ขอขอบพระคุณ / ท่านผู้มีเกียรติ" เป็นระดับภาษาทางการ/พิธีการ)<br>
                    • <strong>29.2 คู่กับ ก.</strong> (เสด็จ เจริญ ถนน เป็นคำยืมภาษาเขมร)<br>
                    • <strong>29.3 คู่กับ ค.</strong> (ฉันทลักษณ์โคลงสี่สุภาพบังคับ เอก 7 โท 4)
                </div>
            `
        });

        // Question 30: รูปแบบผสมผสาน ปรนัยและอัตนัย (1 ข้อ = 30.00 คะแนน!)
        slidesData.push({
            menuTitle: 'ข้อ 30 (ผสมผสาน 30 คะแนน!) : การเขียน',
            title: '🔥 ข้อสอบข้อที่ 30 (รูปแบบผสมผสาน ปรนัย+อัตนัย • 30.00 คะแนนเต็ม!)',
            strand: 'สาระที่ 2 การเขียน (ม.3/4, ม.3/6, ม.3/7)',
            isQuiz: true,
            quizType: 'revealOnly',
            quizId: 'mixed_30',
            html: `
                <div class="passage-box">
                    <strong>บทความเรื่อง “ห้องเรียนไร้กระดาษ: ก้าวใหม่หรือภาระใหม่?”</strong><br>
                    โรงเรียนหลายแห่งเริ่มนำแท็บเล็ตมาใช้แทนหนังสือเรียนเพื่อลดการใช้กระดาษและเพิ่มความทันสมัย ผู้สนับสนุนมองว่าช่วยให้นักเรียนเข้าถึงข้อมูลได้รวดเร็วและพกพาสะดวก แต่ผู้ปกครองบางส่วนกังวลเรื่องค่าใช้จ่าย การซ่อมบำรุง และผลกระทบต่อสายตาของเยาวชนหากใช้งานต่อเนื่องเป็นเวลานาน
                </div>
                <div class="question-text">30.1 (ปรนัย 10 คะแนน) ข้อใดสรุปใจความสำคัญและจุดยืนของบทความนี้ได้ถูกต้อง</div>
                <p style="margin-bottom:10px;">
                    1) แท็บเล็ตไม่มีประโยชน์และควรยกเลิกทันที &nbsp;|&nbsp;
                    <strong>2) การใช้แท็บเล็ตแทนหนังสือมีทั้งข้อดีด้านความทันสมัยและข้อกังวลด้านค่าใช้จ่ายกับสุขภาพ</strong><br>
                    3) นักเรียนทุกคนมีแท็บเล็ตใช้ครบแล้ว &nbsp;|&nbsp;
                    4) การใช้กระดาษทำลายสิ่งแวดล้อมทั้งหมด
                </p>
                <div class="question-text">30.2 (อัตนัย 20 คะแนน) ให้นักเรียนเขียนย่อความบทความข้างต้น และแสดงความคิดเห็นโต้แย้งหรือสนับสนุนอย่างมีเหตุผล ความยาว 5–7 บรรทัด</div>
                <div class="answer-panel" id="ans_mixed_30">
                    <strong>✅ เฉลยและเกณฑ์ให้คะแนน (30 คะแนน):</strong><br>
                    • <strong>30.1 ตอบ ข้อ 2</strong> (10 คะแนน) — สะท้อนทั้งสองด้านของบทความครบถ้วน<br>
                    • <strong>30.2 แนวคำตอบอัตนัย (20 คะแนน):</strong><br>
                    <em>(ส่วนย่อความ 8 คะแนน):</em> บทความกล่าวถึงการนำแท็บเล็ตมาใช้แทนหนังสือเรียนในโรงเรียน ซึ่งแม้จะช่วยให้ค้นคว้าสะดวกและลดกระดาษ แต่ก็สร้างความกังวลด้านค่าใช้จ่ายและสุขภาพสายตา<br>
                    <em>(ส่วนแสดงความเห็นมีเหตุผล 12 คะแนน):</em> ข้าพเจ้าเห็นด้วยบางส่วน ควรนำแท็บเล็ตมาใช้ควบคู่กับหนังสือเรียนอย่างสมดุล เช่น ใช้สืบค้นเฉพาะบางรายวิชา เพื่อลดภาระค่าใช้จ่ายและถนอมสายตานักเรียน
                </div>
            `
        });

        let currentSlide = 0;
        const multiState = {};

        function renderSlides() {
            const container = document.getElementById('slidesContainer');
            const selector = document.getElementById('slideSelector');
            container.innerHTML = '';
            selector.innerHTML = '';

            slidesData.forEach((s, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = s.menuTitle;
                selector.appendChild(opt);

                const slideEl = document.createElement('div');
                slideEl.className = 'slide' + (s.type === 'cover' ? ' cover-slide' : '') + (idx === 0 ? ' active' : '');
                slideEl.id = 'slide_' + idx;

                if (s.type === 'cover') {
                    slideEl.innerHTML = s.html;
                } else {
                    slideEl.innerHTML = `
                        <div class="slide-header">
                            <div class="slide-title">${s.title}</div>
                            <div class="strand-tag">${s.strand}</div>
                        </div>
                        <div class="slide-body">${s.html}</div>
                        <div style="text-align:center; padding-top:10px; margin-top:auto;">
                            <div style="background:#ffffff; border:2px solid #f472b6; border-radius:16px; padding:6px 18px; display:inline-block; color:#be185d; font-weight:700; font-size:0.95rem;">
                                👩‍🏫 ครูเบ็ญจวรรณ สิงห์กุล | โรงเรียนวัดราษฎร์บำรุง สพป.สระบุรี เขต 2
                            </div>
                        </div>
                    `;
                }
                container.appendChild(slideEl);
            });
            updateUI();
        }

        function updateUI() {
            document.querySelectorAll('.slide').forEach((el, idx) => el.classList.toggle('active', idx === currentSlide));
            document.getElementById('slideSelector').value = currentSlide;
            document.getElementById('slideCounter').textContent = `${currentSlide + 1} / ${slidesData.length}`;
            const revealBtn = document.getElementById('globalRevealBtn');
            revealBtn.style.display = slidesData[currentSlide].isQuiz ? 'inline-block' : 'none';
        }

        function nextSlide() { if (currentSlide < slidesData.length - 1) { currentSlide++; updateUI(); } }
        function prevSlide() { if (currentSlide > 0) { currentSlide--; updateUI(); } }
        function goToSlide(idx) { currentSlide = parseInt(idx, 10); updateUI(); }

        function selectSingle(qId, cIdx, correctIdx) {
            const clickedEl = document.getElementById(`${qId}_c${cIdx}`);
            const correctEl = document.getElementById(`${qId}_c${correctIdx}`);
            const panel = document.getElementById(`ans_${qId}`);
            if (cIdx === correctIdx) {
                clickedEl.classList.add('correct-revealed');
                clickedEl.querySelector('.choice-status').textContent = '✅ ถูกต้อง!';
            } else {
                clickedEl.classList.add('wrong-selected');
                clickedEl.querySelector('.choice-status').textContent = '❌ ยังไม่ถูก';
                correctEl.classList.add('correct-revealed');
                correctEl.querySelector('.choice-status').textContent = '✅ คำตอบที่ถูก';
            }
            panel.classList.add('visible');
        }

        function toggleMulti(qId, cIdx, corrects) {
            if (!multiState[qId]) multiState[qId] = new Set();
            const sel = multiState[qId];
            const el = document.getElementById(`${qId}_c${cIdx}`);
            if (sel.has(cIdx)) {
                sel.delete(cIdx);
                el.classList.remove('selected-multi');
                el.querySelector('.choice-status').textContent = '';
            } else if (sel.size < 2) {
                sel.add(cIdx);
                el.classList.add('selected-multi');
                el.querySelector('.choice-status').textContent = '☑️ เลือกแล้ว';
            }
            if (sel.size === 2) {
                for (let i = 0; i < 5; i++) {
                    const btn = document.getElementById(`${qId}_c${i}`);
                    btn.classList.remove('selected-multi');
                    if (corrects.includes(i)) {
                        btn.classList.add('correct-revealed');
                        btn.querySelector('.choice-status').textContent = '✅ คำตอบที่ถูก';
                    } else if (sel.has(i)) {
                        btn.classList.add('wrong-selected');
                        btn.querySelector('.choice-status').textContent = '❌ ยังไม่ถูก';
                    }
                }
                document.getElementById(`ans_${qId}`).classList.add('visible');
            }
        }

        function toggleCurrentAnswer() {
            const s = slidesData[currentSlide];
            if (!s.isQuiz) return;
            const panel = document.getElementById(`ans_${s.quizId}`);
            const isShowing = panel.classList.toggle('visible');
            if (s.quizType === 'single') {
                const correctEl = document.getElementById(`${s.quizId}_c${s.correctIndex}`);
                correctEl.classList.toggle('correct-revealed', isShowing);
                correctEl.querySelector('.choice-status').textContent = isShowing ? '✅ คำตอบที่ถูก' : '';
            } else if (s.quizType === 'multi') {
                s.corrects.forEach(idx => {
                    const correctEl = document.getElementById(`${s.quizId}_c${idx}`);
                    correctEl.classList.toggle('correct-revealed', isShowing);
                    correctEl.querySelector('.choice-status').textContent = isShowing ? '✅ คำตอบที่ถูก' : '';
                });
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
            else document.exitFullscreen().catch(() => {});
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown') nextSlide();
            else if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
            else if (e.key === ' ') { e.preventDefault(); toggleCurrentAnswer(); }
        });

        renderSlides();
    </script>
</body>
</html>
