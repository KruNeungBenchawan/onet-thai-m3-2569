            --card-bg: #ffffff;

            --primary-light: #0ea5e9;
            --accent: #f59e0b;
            --success: #059669;
            --danger: #e11d48;

            --text-muted: #475569;
            --zoom: 1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {

            border-radius: 999px;
            font-family: 'Kodchasan', 'Mali', sans-serif;
            font-size: 0.88rem;
            font-weight: 700;

            align-items: center;
            gap: 4px;

        .btn-primary { background: #0ea5e9; border-color: #bae6fd; }
        .btn-accent { background: #fde047; color: #1e1b4b; border-color: #f59e0b; }

        .btn-sound { background: #10b981; border-color: #a7f3d0; color: #fff; }
        .btn-sound.muted { background: #64748b; border-color: #cbd5e1; }

            color: #fff;
            border: 2px solid #818cf8;
            padding: 6px 10px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.88rem;
            max-width: 245px;
        }
        .stage {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 18px;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        .slide {
            display: none;
            width: 100%;
            max-width: 1320px;
            height: 100%;
            background: #fffdf7;
            background-image:
                radial-gradient(circle at 95% 8%, rgba(253, 224, 71, 0.22) 0%, transparent 28%),
                radial-gradient(circle at 6% 92%, rgba(244, 114, 182, 0.16) 0%, transparent 28%),

            border-radius: 32px;
            border: 5px solid #f59e0b;
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.25), inset 0 0 0 4px #fef3c7;
            padding: 20px 34px;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }
        .slide.active { display: flex; animation: popIn 0.22s ease-out; }
        @keyframes popIn {
            from { opacity: 0.6; transform: scale(0.985); }
            to { opacity: 1; transform: scale(1); }
        }
        .slide-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px dashed #fbbf24;
            padding-bottom: 12px;
            margin-bottom: 16px;
            gap: 14px;
        }
        .slide-header-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
        }
        .mascot-badge {

            width: 76px;
            height: 76px;

            border: 3.5px solid #f59e0b;
            border-radius: 50%;

            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 5px 0 #d97706;
            animation: floatMascot 3s ease-in-out infinite;
        }
        .mascot-badge img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        @keyframes floatMascot {
            0%, 100% { transform: translateY(0px) rotate(-1deg); }
            50% { transform: translateY(-5px) rotate(2deg); }
        }
        .slide-title {
            font-family: 'Kodchasan', 'Sarabun', sans-serif;
            font-size: calc(1.82rem * var(--zoom));
            font-weight: 700;
            color: #0f172a;
            line-height: 1.35;
        }
        .strand-tag {
            background: linear-gradient(90deg, #fce7f3, #ede9fe);
            color: #9d174d;
            border: 2px solid #f472b6;
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 0.96rem;
            font-weight: 700;
            flex-shrink: 0;
        }
        .slide-body {
            flex: 1;
            font-family: 'Sarabun', 'Kodchasan', sans-serif;
            font-size: calc(1.32rem * var(--zoom));
            font-weight: 600;
            line-height: 1.7;
            color: #0f172a;
        }
        .slide-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            margin-top: auto;
            gap: 10px;
            flex-wrap: wrap;

            line-height: 1.72;
            color: #0f172a;

            border-left: 8px solid #9333ea;

            margin-bottom: 14px;
            line-height: 1.5;

            border-radius: 16px;
            padding: 13px 20px;
            text-align: left;
            font-family: 'Sarabun', sans-serif;
            font-size: calc(1.34rem * var(--zoom));
            font-weight: 600;
            color: #0f172a;
            line-height: 1.55;

            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 0 #cbd5e1;

        .choice-btn.correct-revealed { background: #dcfce7; border-color: #16a34a; color: #14532d; font-weight: 700; box-shadow: 0 3px 0 #86efac; }

        .answer-panel {
            display: none;
            background: linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 100%);
            border: 3px solid #10b981;
            border-radius: 18px;
            padding: 16px 22px;
            margin-top: 12px;
            font-family: 'Sarabun', sans-serif;
            font-size: calc(1.28rem * var(--zoom));
            font-weight: 600;
            line-height: 1.68;
            color: #064e3b;
            box-shadow: 0 5px 0 #a7f3d0;
            animation: popIn 0.2s ease-out;
        }
        .answer-panel.visible { display: block; }
        .sparkle-burst {
            position: fixed;
            pointer-events: none;
            font-size: 1.6rem;
            z-index: 9999;
            animation: sparkleFly 0.9s ease-out forwards;
        }
        @keyframes sparkleFly {
            0% { opacity: 1; transform: translate(0, 0) scale(0.7) rotate(0deg); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.3) rotate(180deg); }
        }
        .cover-slide {
            text-align: center;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f0f9ff 0%, #fefce8 50%, #fdf2f8 100%);
        }
        .match-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 12px;
        }
        .match-col {
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 16px;
            padding: 14px;
        }
        .match-col h4 {
            color: #0369a1;
            margin-bottom: 10px;
            font-size: 1.05rem;
        }
        @media (max-width: 720px) {
            .topbar { height: auto; padding: 10px 14px; }
            .slide { padding: 18px 16px; }
            .poem-box { grid-template-columns: 1fr; gap: 2px; }
        }
    </style>
</head>

        let currentSlide = 0;
        let soundEnabled = true;
        let audioCtx = null;
        const multiState = {};
        const matchState = {};

        function getAudioCtx() {
            if (!audioCtx) {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (Ctx) audioCtx = new Ctx();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playTone(freq, duration, type = 'sine', delay = 0, vol = 0.16) {
            if (!soundEnabled) return;
            const ctx = getAudioCtx();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
            gain.gain.setValueAtTime(0.001, ctx.currentTime + delay);
            gain.gain.exponentialRampToValueAtTime(vol, ctx.currentTime + delay + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + delay);
            osc.stop(ctx.currentTime + delay + duration + 0.02);
        }

            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundToggleBtn');

            btn.classList.toggle('muted', !soundEnabled);

            const rect = targetEl ? targetEl.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight / 2, width: 0, height: 0 };
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const icons = ['✨', '⭐', '🌸', '🎉', '💫'];
            for (let i = 0; i < 8; i++) {
                const sp = document.createElement('span');
                sp.className = 'sparkle-burst';
                sp.textContent = icons[i % icons.length];
                const angle = (Math.PI * 2 * i) / 8;
                const dist = 55 + Math.random() * 45;
                sp.style.left = cx + 'px';
                sp.style.top = cy + 'px';
                sp.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
                sp.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
                document.body.appendChild(sp);
                setTimeout(() => sp.remove(), 950);
            }
        }

        function getMascotSvg(idx) {
            const imgs = [
                '../assets/chibi-student-girl.jpg',
                '../assets/chibi-student-boy.jpg',
                '../assets/chibi-teacher.jpg'
            ];
            const src = imgs[idx % imgs.length];
            return `<img src="${src}" alt="การ์ตูนนักเรียน Chibi" />`;
        }

        function renderSlides() {
            const container = document.getElementById('slidesContainer');
            const selector = document.getElementById('slideSelector');
            container.innerHTML = '';
            selector.innerHTML = '';

            slidesData.forEach((s, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = s.menuTitle;
                selector.appendChild(opt);

                let bodyHtml = s.html || '';
                if (s.isQuiz) {
                    const passageHtml = s.passage ? `<div class="passage-box">${s.passage}</div>` : '';
                    const poemHtml = s.poem
                        ? `<div class="poem-box">${s.poem.map(([a, b]) => `<span>${a}</span><span>${b}</span>`).join('')}</div>`
                        : '';

                    let interactiveHtml = '';
                    if (s.quizType === 'single') {
                        interactiveHtml = `<div class="choices-grid">${s.choices.map((c, i) => `
                            <button class="choice-btn" id="${s.quizId}_c${i}" onclick="selectSingle('${s.quizId}', ${i}, ${s.correctIndex})">
                                <span>${c}</span><span class="choice-status"></span>
                            </button>`).join('')}</div>`;
                    } else if (s.quizType === 'multi') {
                        interactiveHtml = `
                            <p style="font-size:0.95rem; color:#6d28d9; font-weight:700; margin-bottom:8px;">☑️ คลิกเลือก 2 คำตอบเพื่อตรวจผล</p>
                            <div class="choices-grid">${s.choices.map((c, i) => `
                            <button class="choice-btn" id="${s.quizId}_c${i}" onclick="toggleMulti('${s.quizId}', ${i}, ${JSON.stringify(s.corrects)})">
                                <span>${c}</span><span class="choice-status"></span>
                            </button>`).join('')}</div>`;
                    } else if (s.quizType === 'match') {
                        interactiveHtml = `
                            <p style="font-size:0.95rem; color:#0369a1; font-weight:700; margin-bottom:8px;">🔗 เลือกคำตอบทั้งหมวด ก. และหมวด ข. อย่างละ 1 ข้อ</p>
                            <div class="match-grid">
                                <div class="match-col">
                                    <h4>หมวด ก. (เลือก ๑ คำตอบ)</h4>
                                    <div class="choices-grid" style="margin-bottom:0;">
                                        ${s.groupA.map((c, i) => `
                                            <button class="choice-btn" id="${s.quizId}_a${i}" onclick="selectMatch('${s.quizId}', 'a', ${i}, ${s.correctA}, ${s.correctB})">
                                                <span>${c}</span><span class="choice-status"></span>
                                            </button>
                                        `).join('')}
                                    </div>
                                </div>
                                <div class="match-col">
                                    <h4>หมวด ข. (เลือก ๑ คำตอบ)</h4>
                                    <div class="choices-grid" style="margin-bottom:0;">
                                        ${s.groupB.map((c, i) => `
                                            <button class="choice-btn" id="${s.quizId}_b${i}" onclick="selectMatch('${s.quizId}', 'b', ${i}, ${s.correctA}, ${s.correctB})">
                                                <span>${c}</span><span class="choice-status"></span>
                                            </button>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>`;
                    }

                    bodyHtml = `
                        ${passageHtml}
                        ${poemHtml}
                        ${interactiveHtml}
                        <div class="answer-panel" id="ans_${s.quizId}">${s.explanation}</div>
                    `;
                }

                const slideEl = document.createElement('div');
                slideEl.className = 'slide' + (s.type === 'cover' ? ' cover-slide' : '') + (idx === 0 ? ' active' : '');
                slideEl.id = 'slide_' + idx;

                if (s.type === 'cover') {
                    slideEl.innerHTML = bodyHtml;
                } else {
                    const mascotColors = [
                        'linear-gradient(135deg,#fef08a,#fde047)',
                        'linear-gradient(135deg,#fbcfe8,#f472b6)',
                        'linear-gradient(135deg,#bae6fd,#38bdf8)',
                        'linear-gradient(135deg,#bbf7d0,#4ade80)'
                    ];
                    const cornerDecos = ['🌸 🌼 ✨', '🍀 🦋 🌟', '🌻 📚 💡', '🌷 🎨 ⭐'];
                    slideEl.innerHTML = `
                        <div class="slide-header">
                            <div class="slide-header-left">
                                <div class="mascot-badge" style="background:${mascotColors[idx % mascotColors.length]}">${getMascotSvg(idx)}</div>
                                <div class="slide-title">${s.title}</div>
                            </div>
                            <div class="strand-tag">${s.strand}</div>
                        </div>
                        <div class="slide-body">${bodyHtml}</div>
                        <div class="slide-footer">
                            <span class="corner-deco">${cornerDecos[idx % cornerDecos.length]}</span>
                            <div style="background:#ffffff; border:2px solid #f472b6; border-radius:16px; padding:6px 18px; display:inline-block; color:#be185d; font-weight:700; font-size:0.92rem; box-shadow:0 3px 0 #fbcfe8;">
                                👩‍🏫 ครูเบ็ญจวรรณ สิงห์กุล | โรงเรียนวัดราษฎร์บำรุง สพป.สระบุรี เขต 2
                            </div>
                            <span class="corner-deco">${cornerDecos[(idx + 1) % cornerDecos.length]}</span>
                        </div>
                    `;
                }
                container.appendChild(slideEl);
            });
            updateUI();
        }

        function updateUI() {
            document.querySelectorAll('.slide').forEach((el, idx) => el.classList.toggle('active', idx === currentSlide));
            document.getElementById('slideSelector').value = currentSlide;
            document.getElementById('slideCounter').textContent = `${currentSlide + 1} / ${slidesData.length}`;
            const revealBtn = document.getElementById('globalRevealBtn');
            revealBtn.style.display = slidesData[currentSlide].isQuiz ? 'inline-block' : 'none';
        }

        function nextSlide() { if (currentSlide < slidesData.length - 1) { currentSlide++; updateUI(); } }
        function prevSlide() { if (currentSlide > 0) { currentSlide--; updateUI(); } }
        function goToSlide(idx) { currentSlide = parseInt(idx, 10); updateUI(); }

        function selectSingle(qId, cIdx, correctIdx) {
            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById(`${qId}_c${i}`);
                btn.classList.remove('correct-revealed', 'wrong-selected');
                btn.querySelector('.choice-status').textContent = '';
            }
            const clickedEl = document.getElementById(`${qId}_c${cIdx}`);
            const correctEl = document.getElementById(`${qId}_c${correctIdx}`);
            const panel = document.getElementById(`ans_${qId}`);
            if (cIdx === correctIdx) {
                clickedEl.classList.add('correct-revealed');
                clickedEl.querySelector('.choice-status').textContent = '✅ ถูกต้อง!';
                playCorrectSound();
                spawnSparkles(clickedEl);
            } else {
                clickedEl.classList.add('wrong-selected');
                clickedEl.querySelector('.choice-status').textContent = '❌ ยังไม่ถูก';
                correctEl.classList.add('correct-revealed');
                correctEl.querySelector('.choice-status').textContent = '✅ คำตอบที่ถูก';
                playWrongSound();
            }
            panel.classList.add('visible');
        }

        function toggleMulti(qId, cIdx, corrects) {
            if (!multiState[qId]) multiState[qId] = new Set();
            const sel = multiState[qId];
            const el = document.getElementById(`${qId}_c${cIdx}`);
            if (sel.has(cIdx)) {
                sel.delete(cIdx);
                el.classList.remove('selected-multi');
                el.querySelector('.choice-status').textContent = '';
                playClickSound();
            } else if (sel.size < 2) {
                sel.add(cIdx);
                el.classList.add('selected-multi');
                el.querySelector('.choice-status').textContent = '☑️ เลือกแล้ว';
                if (sel.size < 2) playClickSound();
            }
            if (sel.size === 2) {
                let allCorrect = true;
                for (let i = 0; i < 5; i++) {
                    const btn = document.getElementById(`${qId}_c${i}`);
                    btn.classList.remove('selected-multi', 'correct-revealed', 'wrong-selected');
                    if (corrects.includes(i)) {
                        btn.classList.add('correct-revealed');
                        btn.querySelector('.choice-status').textContent = '✅ คำตอบที่ถูก';
                        if (!sel.has(i)) allCorrect = false;
                    } else if (sel.has(i)) {
                        btn.classList.add('wrong-selected');
                        btn.querySelector('.choice-status').textContent = '❌ ยังไม่ถูก';
                        allCorrect = false;
                    } else {
                        btn.querySelector('.choice-status').textContent = '';
                    }
                }
                if (allCorrect) {
                    playCorrectSound();
                    spawnSparkles(el);
                } else {
                    playWrongSound();
                }
                document.getElementById(`ans_${qId}`).classList.add('visible');
            }
        }

        function selectMatch(qId, group, idx, correctA, correctB) {
            if (!matchState[qId]) matchState[qId] = {};
            matchState[qId][group] = idx;
            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById(`${qId}_${group}${i}`);
                btn.classList.remove('selected-multi', 'correct-revealed', 'wrong-selected');
                btn.querySelector('.choice-status').textContent = '';
            }
            const selBtn = document.getElementById(`${qId}_${group}${idx}`);
            selBtn.classList.add('selected-multi');
            selBtn.querySelector('.choice-status').textContent = '☑️ เลือกแล้ว';

            if (matchState[qId].a !== undefined && matchState[qId].b !== undefined) {
                const isAllCorrect = (matchState[qId].a === correctA && matchState[qId].b === correctB);
                [['a', correctA], ['b', correctB]].forEach(([g, corr]) => {
                    for (let i = 0; i < 4; i++) {
                        const btn = document.getElementById(`${qId}_${g}${i}`);
                        btn.classList.remove('selected-multi');
                        if (i === corr) {
                            btn.classList.add('correct-revealed');
                            btn.querySelector('.choice-status').textContent = '✅ คำตอบที่ถูก';
                        } else if (matchState[qId][g] === i) {
                            btn.classList.add('wrong-selected');
                            btn.querySelector('.choice-status').textContent = '❌ ยังไม่ถูก';
                        }
                    }
                });
                if (isAllCorrect) {
                    playCorrectSound();
                    spawnSparkles(selBtn);
                } else {
                    playWrongSound();
                }
                document.getElementById(`ans_${qId}`).classList.add('visible');
            } else {
                playClickSound();
            }
        }

        function toggleCurrentAnswer() {
            const s = slidesData[currentSlide];
            if (!s.isQuiz) return;
            const panel = document.getElementById(`ans_${s.quizId}`);
            const isShowing = panel.classList.toggle('visible');
            if (isShowing) {
                playRevealSound();
                spawnSparkles(document.getElementById('globalRevealBtn'));
            } else {
                playClickSound();
            }
            if (s.quizType === 'single') {
                const correctEl = document.getElementById(`${s.quizId}_c${s.correctIndex}`);
                correctEl.classList.toggle('correct-revealed', isShowing);
                correctEl.querySelector('.choice-status').textContent = isShowing ? '✅ คำตอบที่ถูก' : '';
            } else if (s.quizType === 'multi') {
                s.corrects.forEach(idx => {
                    const correctEl = document.getElementById(`${s.quizId}_c${idx}`);
                    correctEl.classList.toggle('correct-revealed', isShowing);
                    correctEl.querySelector('.choice-status').textContent = isShowing ? '✅ คำตอบที่ถูก' : '';
                });
            } else if (s.quizType === 'match') {
                [['a', s.correctA], ['b', s.correctB]].forEach(([g, corr]) => {
                    const correctEl = document.getElementById(`${s.quizId}_${g}${corr}`);
                    correctEl.classList.toggle('correct-revealed', isShowing);
                    correctEl.querySelector('.choice-status').textContent = isShowing ? '✅ คำตอบที่ถูก' : '';
                });
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
            else document.exitFullscreen().catch(() => {});
        }

        let textZoom = 1;
        function zoomText(delta) {
            textZoom = Math.min(1.5, Math.max(0.8, +(textZoom + delta).toFixed(2)));
            document.documentElement.style.setProperty('--zoom', textZoom);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown') nextSlide();
            else if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
            else if (e.key === ' ') { e.preventDefault(); toggleCurrentAnswer(); }
        });

        renderSlides();
    </script>
</body>
</html>
